[project]
name = "glitchminer"
version = "0.1.0"
description = "GlitchMiner: gradient-based glitch token detector (vendored from https://github.com/wooozihui/GlitchMiner)"
requires-python = ">=3.9,<4.0"
dependencies = [
    "transformers>=4.51.0",
    "torch>=2.2.1",
    "tqdm>=4.66.0",
]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glitchminer"]
