[project]
name = "magikarp-further-testing"
version = "0.1.0"
description = "Hybrid Multi-Layer Under-Trained Token Mitigation System (HMUTTMS) built on Magikarp"
authors = [{ name = "Thesis 2510674" }]
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
  "magikarp @ file:./magikarp_lib",
  "glitchminer @ file:./glitchminer_lib",
  "transformers>=4.44",
  "tqdm>=4.66",
  "accelerate>=0.33",
  "huggingface_hub>=0.24",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
